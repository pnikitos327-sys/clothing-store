{% extends 'layout.html' %}
{% block title %}ovvvll{% endblock %}

{% block content %}

<div style="position: relative; top: 80px; left: 1100px;">
    <h3>{{ product.name }}</h3>
    <h3>{{ product.price }}</h3>
</div>

<div style="display: flex; justify-content: center;">

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; position: relative; top: -20px; left: -100px;">

        <div style="width: 400px; height: 580px;">
            <img src="{{ product.image.url }}" alt="{{ product.name }}" style="width: 100%; height: 100%;">
        </div>


        {% if images|length > 0 %}
            <div style="width: 400px; height: 580px;">
                <img src="{{ images.0.image.url }}" alt="{{ product.name }}" style="width: 100%; height: 100%;">
            </div>
        {% endif %}

        <!-- 3-е фото (второе доп.) -->
        {% if images|length > 1 %}
            <div style="width: 400px; height: 580px;">
                <img src="{{ images.1.image.url }}" alt="{{ product.name }}" style="width: 100%; height: 100%;">
            </div>
        {% endif %}

        {% if images|length > 2 %}
            <div style="width: 400px; height: 580px;">
                <img src="{{ images.2.image.url }}" alt="{{ product.name }}" style="width: 100%; height: 100%;">
            </div>
        {% endif %}

    </div>
</div>

{% endblock %}
